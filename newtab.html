<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 第一页：工作（三区结构，内容居中，左右对称留白） -->
  <section id="pageWork" class="page page-work">
    <div class="page-inner">
      <div class="cols">
        <aside class="col col-left"></aside>
        <main class="col col-main">
          <div id="clock" class="clock">--:--:--</div>
          <div id="date" class="date"></div>
          <div class="search-anchor" id="anchorWork">
            <div id="searchWrap" class="search-wrap">
              <input id="search" class="search" type="text"
                     placeholder="输入网址或搜索词，回车直达…"
                     autocomplete="off" spellcheck="false">
              <button id="searchClear" class="search-clear hidden" type="button" title="清空">
                <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
          <div class="tool-block">
            <div class="tool-head">
              <span class="list-title">工作工具</span>
            </div>
            <div id="workTools" class="tool-list"></div>
          </div>
        </main>
        <aside class="col col-right"></aside>
      </div>
    </div>
  </section>

  <!-- 第二页：表盘（信息面板：天气 + API 余额，可继续扩展卡片） -->
  <section id="pageDashboard" class="page page-dashboard">
    <div class="page-inner">
      <div class="search-anchor" id="anchorDash"></div>
      <div class="dash-board">
        <!-- 天气卡片：点击天气行展开 7 天预报 -->
        <div class="dash-card">
          <div id="weather" class="weather hidden"></div>
          <div id="weatherWrap" class="weather-wrap">
            <div id="weatherPanelBody" class="wp-body"></div>
          </div>
        </div>
        <!-- API 余额卡片 -->
        <div class="dash-card">
          <div class="tool-head">
            <span class="list-title">API 余额</span>
          </div>
          <div id="dsMonitor" class="ds-monitor">
            <div class="ds-row"><span class="ds-label">余额</span><span id="dsBalance" class="ds-val">--</span></div>
            <div class="ds-row"><span class="ds-label">状态</span><span id="dsState" class="ds-val">--</span></div>
            <div id="dsEdit" class="ds-edit hidden">
              <input id="dsKeyInput" type="password" placeholder="粘贴 sk- 开头的 API Key" autocomplete="off" spellcheck="false">
              <div class="ds-actions">
                <button id="dsSave" class="btn btn-primary btn-sm" type="button">保存</button>
                <button id="dsCancel" class="btn btn-plain btn-sm" type="button">取消</button>
              </div>
            </div>
            <div class="ds-actions">
              <button id="dsSetup" class="btn btn-plain btn-sm" type="button">设置 Key</button>
              <button id="dsRefresh" class="btn btn-plain btn-sm" type="button">刷新</button>
            </div>
            <div class="ds-actions">
              <button id="dsChart" class="btn btn-plain btn-sm" type="button">📊 每日消费</button>
            </div>
          </div>
          <!-- 每日消费图表：卡片下方就地展开 -->
          <div id="dsChartWrap" class="ds-chart-wrap">
            <div class="ds-chart-head">近 7 天每日消费</div>
            <div id="dsChartBody" class="ds-chart"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 第二页：私人（左工具B / 中收藏夹管理 / 右侧预留） -->
  <section id="pagePrivate" class="page page-private">
    <div class="page-inner">
      <div class="cols">
        <aside class="col col-left">
          <div class="tool-block">
            <div class="tool-head">
              <span class="list-title" id="privateToolsTitle">工具B</span>
            </div>
            <div id="privateTools" class="tool-list"></div>
          </div>
        </aside>
        <main class="col col-main">
          <div class="search-anchor" id="anchorPrivate"></div>
          <div class="list-head">
            <span class="list-title">收藏夹</span>
            <button id="btnNew" class="btn btn-primary btn-sm" type="button">+ 新建</button>
          </div>
          <div id="bookmarkList" class="bm-list"></div>
          <div id="emptyHint" class="empty-hint hidden">这里空空如也，点右上角「+ 新建」或空白处右键添加收藏</div>
        </main>
        <aside class="col col-right"></aside>
      </div>
    </div>
  </section>

  <!-- 页面指示点 -->
  <nav id="pageNav" class="page-dots">
    <button type="button" data-target="pageWork" class="active" title="工作页"></button>
    <button type="button" data-target="pageDashboard" title="表盘页"></button>
    <button type="button" data-target="pagePrivate" title="私人页"></button>
  </nav>

  <div id="ctxMenu" class="ctx-menu hidden"></div>

  <div id="modalMask" class="modal-mask hidden">
    <div class="modal">
      <h3 id="modalTitle">新建收藏</h3>
      <div class="form-row" id="modalTypeRow">
        <label for="fldType">类型</label>
        <select id="fldType">
          <option value="bookmark">书签</option>
          <option value="folder">文件夹</option>
        </select>
      </div>
      <div class="form-row">
        <label for="fldTitle">名称</label>
        <input id="fldTitle" type="text" placeholder="收藏名称">
      </div>
      <div class="form-row" id="urlRow">
        <label for="fldUrl">网址</label>
        <input id="fldUrl" type="text" placeholder="https://example.com">
      </div>
      <div class="form-row" id="parentRow">
        <label for="fldParent">位置</label>
        <select id="fldParent"></select>
      </div>
      <div class="modal-actions">
        <button id="btnCancel" class="btn btn-plain" type="button">取消</button>
        <button id="btnSave" class="btn btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
